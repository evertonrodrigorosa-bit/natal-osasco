.panico-st{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:#ffe3e3;color:#7a0010;border:2px solid #b3001b;display:flex;flex-direction:column;gap:8px}
.panico-st.ok{background:var(--run-bg);color:var(--fg);border-color:var(--run)}
.primary-a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:10px;background:#b3001b;color:#fff;font-weight:700;text-decoration:none}
.panico-faixa{margin-top:12px;padding:12px 14px;border-radius:var(--r);background:#b3001b;color:#fff;display:flex;flex-direction:column;gap:8px}
.panico-faixa a{color:#fff;font-weight:700} .panico-faixa button{background:#fff;color:#b3001b;border-color:#fff;font-weight:700}
.panico-modal{background:rgba(179,0,27,.85);animation:pisca 1s steps(2) infinite} .panico-modal .pn{display:flex;flex-direction:column;gap:10px}
.panico-modal .pn+.pn{border-top:1px solid var(--line,#ccc);padding-top:12px}
@keyframes pisca{50%{background:rgba(60,0,0,.9)}}
@media (prefers-reduced-motion:reduce){.panico-modal{animation:none}}
body:has(.panico-bar) #app{padding-bottom:110px}
.passos{margin:8px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.alarme{border:3px solid var(--late)} .alarme h2{color:var(--late)}
.task.guarda.on{border-left:6px solid var(--ok)} .task.guarda.off{border-left:6px solid var(--late)} .task.guarda{border-left:6px solid var(--line)}
.task.guarda.on .d{color:var(--ok)} .task.guarda.off .d{color:var(--late)}
.turno{display:flex;flex-direction:column;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sf-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sf-l{width:96px;flex:none;font-size:.82rem;font-weight:600;color:var(--muted)}
.sf{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.75rem;text-align:center}
.sf img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.sf.falta{width:64px;height:64px;justify-content:center;border-radius:8px;border:2px dashed var(--late);color:var(--late);font-weight:600;font-size:.68rem;overflow:hidden}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:460px){.grid3{grid-template-columns:1fr 1fr}.grid3 label:first-child{grid-column:1/-1}}
.welcome h2{font-family:var(--display);font-size:1.6rem;margin:24px 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><img class="logo" src="/logo-mij.png" alt="Grupo MIJ" width="52" height="40"><h1><small>🎄 Decoração de Natal</small>Osasco · Tarefas</h1><button class="role" id="role" data-act="sair" hidden></button></div>
  <div class="stats" id="stats"></div>
</div></header>
<main class="wrap" id="app"><div class="empty">Carregando…</div></main>
<input type="file" id="foto-seg" accept="image/*" capture="user" hidden aria-hidden="true" tabindex="-1">
<input type="file" id="foto-fim" accept="image/*" capture="environment" hidden aria-hidden="true" tabindex="-1">
<script src="/app.js"></script>
</body>
</html>
